<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Food Tracker – Learn Sphere</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Daily Nutrition Tracker</h1>
  <p>Log what you eat and see your daily totals.</p>
  <nav>
    <a href="tracker.html" class="active">Food Log</a>
    <a href="assistant.html">Food Assistant</a>
  </nav>
</header>

<!-- ============================================================================
     PART A — DAILY NUTRITION & FOOD HABIT TRACKER  (HTML)
     ============================================================================ -->
<main class="grid">
  <div>
    <!-- A.1: Log breakfast / lunch / dinner / snacks -->
    <div class="card">
      <h2>Add food</h2>
      <label for="logDate">Date</label>
      <input type="date" id="logDate">
      <div class="row">
        <div><label for="logMeal">Meal</label>
          <select id="logMeal">
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snack">Snack</option>
          </select></div>
        <div><label for="logQty">Quantity</label>
          <input type="number" id="logQty" min="0.25" step="0.25" value="1"></div>
      </div>
      <label for="logFood">Food</label>
      <select id="logFood"></select>
      <button class="btn" id="addBtn">Add to log</button>
      <p class="note">Values are approximate and use common serving sizes.</p>
    </div>

    <!-- A.3: User-defined nutrition goals -->
    <div class="card">
      <h2>My daily goals</h2>
      <div class="row">
        <div><label for="gKcal">Calories (kcal)</label><input type="number" id="gKcal" min="0"></div>
        <div><label for="gP">Protein (g)</label><input type="number" id="gP" min="0"></div>
      </div>
      <div class="row">
        <div><label for="gC">Carbs (g)</label><input type="number" id="gC" min="0"></div>
        <div><label for="gF">Fat (g)</label><input type="number" id="gF" min="0"></div>
      </div>
      <button class="btn ghost" id="saveGoals">Save goals</button>
    </div>
  </div>

  <div>
    <!-- A.2 + A.3: Daily totals and progress toward goals -->
    <div class="card">
      <h2 id="summaryTitle">Today's summary</h2>
      <div id="progress"></div>
    </div>
    <!-- A.4: Entries for the selected date, grouped by meal -->
    <div class="card">
      <h2>Food entries</h2>
      <div id="entries"></div>
    </div>
    <!-- A.4: Previous days (food history) -->
    <div class="card">
      <h2>Previous days</h2>
      <div id="history"></div>
    </div>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/tracker.js"></script>
</body>
</html>
